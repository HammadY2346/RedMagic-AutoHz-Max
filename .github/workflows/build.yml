name: AutoHz Max build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Publish build log (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -n -E "error:|FAILED|What went wrong|Caused by|\.java:[0-9]+" build.log | head -200 > build-errors.txt || true
          tail -80 build.log >> build-errors.txt
          B64=$(base64 -w0 build-errors.txt)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/ci-logs/last-build-errors.txt?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/ci-logs/last-build-errors.txt" -f message="ci: build errors ${GITHUB_SHA::7} [skip ci]" -f content="$B64" -f branch=main -f sha="$SHA" >/dev/null
          else gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/ci-logs/last-build-errors.txt" -f message="ci: build errors ${GITHUB_SHA::7} [skip ci]" -f content="$B64" -f branch=main >/dev/null; fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoHzMax-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Commit APK to release/ (so it can be downloaded without an account)
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B64=$(base64 -w0 app/build/outputs/apk/release/app-release.apk)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/release/AutoHzMax.apk?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/release/AutoHzMax.apk" -f message="release: AutoHzMax.apk from ${GITHUB_SHA::7} [skip ci]" -f content="$B64" -f branch=main -f sha="$SHA" >/dev/null
          else gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/release/AutoHzMax.apk" -f message="release: AutoHzMax.apk from ${GITHUB_SHA::7} [skip ci]" -f content="$B64" -f branch=main >/dev/null; fi
